<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Debug IDs</title>
</head>
<body>
  <h1>Debug buttons</h1>

  <button id="btn-login">Login via Keycloak</button>
  <button id="btn-login-normal">Login as current user</button>
  <button id="btn-login-attack">Simulate attack</button>
  <button id="btn-me">GET /me</button>
  <button id="btn-logout-backend">Backend logout</button>

  <script>
    function safeOnClick(id, handler) {
      const el = document.getElementById(id);
      if (!el) {
        console.warn('Element not found for id =', id);
        return;
      }
      el.onclick = handler;
    }

    function init() {
      console.log('init called');

      safeOnClick('btn-login', () => {
        console.log('btn-login clicked');
      });

      safeOnClick('btn-login-normal', () => {
        console.log('btn-login-normal clicked');
      });

      safeOnClick('btn-login-attack', () => {
        console.log('btn-login-attack clicked');
      });

      safeOnClick('btn-me', () => {
        console.log('btn-me clicked');
      });

      safeOnClick('btn-logout-backend', () => {
        console.log('btn-logout-backend clicked');
      });
    }

    window.addEventListener('load', init);
  </script>
</body>
</html>
